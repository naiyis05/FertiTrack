# Pensado para PCs de 8 GB: un solo proceso (Kotlin compila dentro del daemon de Gradle).
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Datos públicos del robot (firmware Maestro v6).
# La clave del AP NO va aquí: ponla en local.properties como
#   fertitrack.ap.password=...
# Si cambias la IP, actualiza también res/xml/network_security_config.xml.
fertitrack.robot.ip=192.168.4.1
fertitrack.ap.ssid=FertiTrack_AP
